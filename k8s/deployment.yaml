# ============================================================
# AI Automated Security Engineer - Kubernetes Deployment
# Production-grade K8s manifests for enterprise deployment
# ============================================================

---
apiVersion: v1
kind: Namespace
metadata:
  name: aase-platform
  labels:
    app: ai-security-engineer
    environment: production

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aase-config
  namespace: aase-platform
data:
  ENVIRONMENT: "production"
  PORT: "8443"
  OLLAMA_BASE_URL: "http://ollama-service:11434"
  ELASTICSEARCH_URL: "http://elasticsearch-service:9200"
  REDIS_URL: "redis://redis-service:6379/0"
  DATABASE_URL: "postgresql+asyncpg://aase:$(POSTGRES_PASSWORD)@postgres-service:5432/aase_db"
  MAX_CONCURRENT_SCANS: "20"
  AI_TRIAGE_ENABLED: "true"
  AI_COMPLIANCE_ANALYSIS: "true"
  ANOMALY_THRESHOLD: "0.85"

---
apiVersion: v1
kind: Secret
metadata:
  name: aase-secrets
  namespace: aase-platform
type: Opaque
stringData:
  SECRET_KEY: "REPLACE_WITH_SECRET"
  JWT_SECRET: "REPLACE_WITH_JWT_SECRET"
  POSTGRES_PASSWORD: "REPLACE_WITH_DB_PASSWORD"
  REDIS_PASSWORD: "REPLACE_WITH_REDIS_PASSWORD"
  ELASTICSEARCH_PASSWORD: "REPLACE_WITH_ES_PASSWORD"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aase-api
  namespace: aase-platform
  labels:
    app: aase-api
    component: core
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aase-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: aase-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: aase-api
        image: ghcr.io/mangesh-bhattacharya/ai-automated-security-engineer:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8443
          protocol: TCP
        envFrom:
        - configMapRef:
            name: aase-config
        - secretRef:
            name: aase-secrets
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "4000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8443
            scheme: HTTPS
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8443
            scheme: HTTPS
          initialDelaySeconds: 30
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: tls-certs
          mountPath: /app/certs
          readOnly: true
        - name: aase-logs
          mountPath: /app/logs
        - name: aase-reports
          mountPath: /app/reports
      volumes:
      - name: tls-certs
        secret:
          secretName: aase-tls
      - name: aase-logs
        persistentVolumeClaim:
          claimName: aase-logs-pvc
      - name: aase-reports
        persistentVolumeClaim:
          claimName: aase-reports-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: aase-api-service
  namespace: aase-platform
  labels:
    app: aase-api
spec:
  selector:
    app: aase-api
  ports:
  - port: 443
    targetPort: 8443
    protocol: TCP
  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aase-api-hpa
  namespace: aase-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aase-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aase-celery-scanner
  namespace: aase-platform
spec:
  replicas: 4
  selector:
    matchLabels:
      app: aase-celery-scanner
  template:
    metadata:
      labels:
        app: aase-celery-scanner
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: celery-scanner
        image: ghcr.io/mangesh-bhattacharya/ai-automated-security-engineer:latest
        command: ["celery", "-A", "core.celery_app", "worker",
                  "-Q", "scans", "-c", "4", "--loglevel=info"]
        envFrom:
        - configMapRef:
            name: aase-config
        - secretRef:
            name: aase-secrets
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "3Gi"
            cpu: "2000m"
        securityContext:
          capabilities:
            add: ["NET_RAW", "NET_ADMIN"]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: aase-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        ports:
        - containerPort: 11434
        resources:
          requests:
            memory: "16Gi"
            cpu: "4000m"
          limits:
            memory: "64Gi"
            cpu: "16000m"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: ollama-models
          mountPath: /root/.ollama
      volumes:
      - name: ollama-models
        persistentVolumeClaim:
          claimName: ollama-models-pvc
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule

---
apiVersion: v1
kind: Service
metadata:
  name: ollama-service
  namespace: aase-platform
spec:
  selector:
    app: ollama
  ports:
  - port: 11434
    targetPort: 11434
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aase-network-policy
  namespace: aase-platform
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: aase-platform
    - podSelector:
        matchLabels:
          app: aase-api
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: aase-platform
