# ============================================================
# AI Automated Security Engineer - Docker Compose
# Full self-hosted stack for development/production
# ============================================================

version: "3.9"

networks:
  aase-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres-data:
  redis-data:
  elasticsearch-data:
  ollama-models:
  aase-logs:
  aase-reports:
  prometheus-data:
  grafana-data:

services:

  # ─────────────────────────────────────────────
  # Core Application
  # ─────────────────────────────────────────────
  aase-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: aase-api
    restart: unless-stopped
    ports:
      - "8443:8443"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://aase:$${POSTGRES_PASSWORD}@postgres:5432/aase_db
      - REDIS_URL=redis://:$${REDIS_PASSWORD}@redis:6379/0
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - OLLAMA_BASE_URL=http://ollama:11434
      - SECRET_KEY=$${SECRET_KEY}
      - JWT_SECRET=$${JWT_SECRET}
      - AWS_ACCESS_KEY_ID=$${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=$${AWS_SECRET_ACCESS_KEY}
      - AZURE_TENANT_ID=$${AZURE_TENANT_ID}
      - AZURE_CLIENT_ID=$${AZURE_CLIENT_ID}
      - AZURE_CLIENT_SECRET=$${AZURE_CLIENT_SECRET}
      - SLACK_WEBHOOK_URL=$${SLACK_WEBHOOK_URL}
      - PAGERDUTY_API_KEY=$${PAGERDUTY_API_KEY}
      - JIRA_URL=$${JIRA_URL}
      - JIRA_TOKEN=$${JIRA_TOKEN}
    volumes:
      - aase-logs:/app/logs
      - aase-reports:/app/reports
      - ./certs:/app/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - aase-network
    healthcheck:
      test: ["CMD", "curl", "-f", "https://localhost:8443/health", "--insecure"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─────────────────────────────────────────────
  # Celery Workers (Async Security Scanning)
  # ─────────────────────────────────────────────
  celery-scanner:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: aase-celery-scanner
    restart: unless-stopped
    command: celery -A core.celery_app worker -Q scans -c 4 --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://aase:$${POSTGRES_PASSWORD}@postgres:5432/aase_db
      - REDIS_URL=redis://:$${REDIS_PASSWORD}@redis:6379/0
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - aase-logs:/app/logs
    depends_on:
      - redis
      - postgres
    networks:
      - aase-network
    cap_add:
      - NET_RAW
      - NET_ADMIN

  celery-threats:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: aase-celery-threats
    restart: unless-stopped
    command: celery -A core.celery_app worker -Q threats -c 8 --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://aase:$${POSTGRES_PASSWORD}@postgres:5432/aase_db
      - REDIS_URL=redis://:$${REDIS_PASSWORD}@redis:6379/0
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    volumes:
      - aase-logs:/app/logs
    depends_on:
      - redis
      - elasticsearch
    networks:
      - aase-network

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: aase-celery-beat
    restart: unless-stopped
    command: celery -A core.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://aase:$${POSTGRES_PASSWORD}@postgres:5432/aase_db
      - REDIS_URL=redis://:$${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - aase-logs:/app/logs
    depends_on:
      - redis
    networks:
      - aase-network

  # ─────────────────────────────────────────────
  # Self-Hosted LLM (Ollama)
  # ─────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: aase-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_NUM_PARALLEL=4
    networks:
      - aase-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/version"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─────────────────────────────────────────────
  # Database (PostgreSQL + TimescaleDB)
  # ─────────────────────────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: aase-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=aase_db
      - POSTGRES_USER=aase
      - POSTGRES_PASSWORD=$${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - aase-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aase -d aase_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Cache & Message Broker (Redis)
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: aase-redis
    restart: unless-stopped
    command: redis-server --requirepass $${REDIS_PASSWORD} --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - aase-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # SIEM / Log Analytics (Elasticsearch)
  # ─────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
    container_name: aase-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=$${ELASTICSEARCH_PASSWORD}
      - ES_JAVA_OPTS=-Xms2g -Xmx4g
      - xpack.security.http.ssl.enabled=false
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - aase-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:$${ELASTICSEARCH_PASSWORD} http://localhost:9200/_cluster/health | grep -q 'green\|yellow'"]
      interval: 30s
      timeout: 15s
      retries: 10

  kibana:
    image: docker.elastic.co/kibana/kibana:8.14.0
    container_name: aase-kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=$${ELASTICSEARCH_PASSWORD}
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - aase-network

  # ─────────────────────────────────────────────
  # Monitoring Stack
  # ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: aase-prometheus
    restart: unless-stopped
    volumes:
      - prometheus-data:/prometheus
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - aase-network

  grafana:
    image: grafana/grafana:latest
    container_name: aase-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=$${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_PROTOCOL=https
      - GF_SERVER_CERT_FILE=/etc/grafana/certs/server.crt
      - GF_SERVER_CERT_KEY=/etc/grafana/certs/server.key
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./certs:/etc/grafana/certs:ro
    ports:
      - "3000:3000"
    networks:
      - aase-network

  # ─────────────────────────────────────────────
  # Reverse Proxy (Nginx)
  # ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: aase-nginx
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./dashboard:/usr/share/nginx/html:ro
    depends_on:
      - aase-api
    networks:
      - aase-network
